<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Portfolio</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">Portfolio</div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/projects">Projects</a></li>
                <li><a href="/blog" class="active">Blog</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>Blog</h1>
            <p>Thoughts, tutorials, and insights on web development</p>
        </div>
    </section>

    <!-- Blog Posts -->
    <section class="blog-section">
        <div class="container">
            <div class="blog-posts" id="blog-container">
                <!-- Blog posts will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 My Portfolio. All rights reserved.</p>
            <div class="social-links">
                <a href="https://github.com/The90sInc">GitHub</a>
                <a href="https://x.com/The90sInc">Twitter</a>
                <a href="https://www.linkedin.com/in/emmanuelokunlola/">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script>
        // Load all blog posts
        async function loadBlogPosts() {
            try {
                const response = await fetch('/api/blog');
                const posts = await response.json();
                const container = document.getElementById('blog-container');
                
                posts.forEach(post => {
                    const postElement = document.createElement('article');
                    postElement.className = 'blog-post';
                    postElement.innerHTML = `
                        <div class="post-header">
                            <h2>${post.title}</h2>
                            <div class="post-meta">
                                <span class="post-date">${new Date(post.date).toLocaleDateString()}</span>
                            </div>
                        </div>
                        <div class="post-excerpt">
                            <p>${post.excerpt}</p>
                        </div>
                        <div class="post-content">
                            <p>${post.content}</p>
                        </div>
                        <div class="post-tags">
                            ${post.tags.map(tag => `<span class="blog-tag">${tag}</span>`).join('')}
                        </div>
                    `;
                    container.appendChild(postElement);
                });
            } catch (error) {
                console.error('Error loading blog posts:', error);
                document.getElementById('blog-container').innerHTML = '<p>Error loading blog posts. Please try again later.</p>';
            }
        }

        // Load blog posts on page load
        document.addEventListener('DOMContentLoaded', loadBlogPosts);
    </script>
</body>
</html>
