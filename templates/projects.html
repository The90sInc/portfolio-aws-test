<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Portfolio</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">Portfolio</div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/projects" class="active">Projects</a></li>
                <li><a href="/blog">Blog</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>My Projects</h1>
            <p>A collection of projects I've built and worked on</p>
        </div>
    </section>

    <!-- Projects Grid -->
    <section class="projects-section">
        <div class="container">
            <div class="projects-grid" id="projects-container">
                <!-- Projects will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 My Portfolio. All rights reserved.</p>
            <div class="social-links">
                <a href="https://github.com/The90sInc">GitHub</a>
                <a href="https://x.com/The90sInc">Twitter</a>
                <a href="https://www.linkedin.com/in/emmanuelokunlola/">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script>
        // Load all projects
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const projects = await response.json();
                const container = document.getElementById('projects-container');
                
                projects.forEach(project => {
                    const projectCard = document.createElement('div');
                    projectCard.className = 'project-card';
                    projectCard.innerHTML = `
                        <div class="project-image" style="background-color: #f0f0f0;">
                            <span style="font-size: 3em; color: #ddd;">📁</span>
                        </div>
                        <div class="project-info">
                            <h3>${project.title}</h3>
                            <p class="project-date">Completed: ${new Date(project.date).toLocaleDateString()}</p>
                            <p>${project.description}</p>
                            <div class="tech-tags">
                                ${project.technologies.map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
                            </div>
                            <div class="project-links">
                                ${project.github_link ? `<a href="${project.github_link}" target="_blank" class="link-btn">View on GitHub</a>` : ''}
                                ${project.demo_link ? `<a href="${project.demo_link}" target="_blank" class="link-btn">Live Demo</a>` : ''}
                            </div>
                        </div>
                    `;
                    container.appendChild(projectCard);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projects-container').innerHTML = '<p>Error loading projects. Please try again later.</p>';
            }
        }

        // Load projects on page load
        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
